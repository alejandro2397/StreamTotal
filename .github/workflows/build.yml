name: Build StreamTotal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 está vacío o no existe en GitHub Secrets."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > "$GITHUB_WORKSPACE/app/release-keystore.jks"

          test -s "$GITHUB_WORKSPACE/app/release-keystore.jks"
          echo "Keystore reconstruido correctamente."

      - name: Verify release keystore
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Validando keystore de StreamTotal..."
          keytool -list \
            -keystore "$RELEASE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD"

          echo "Buscando el alias configurado..."
          keytool -list \
            -keystore "$RELEASE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore, contraseña y alias verificados correctamente."

      - name: Build APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::No se encontró el APK de release."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

      - name: List generated release files
        if: always()
        run: |
          echo "=== APK ==="
          find app/build/outputs/apk -type f -maxdepth 5 -print 2>/dev/null || true

          echo "=== AAB ==="
          find app/build/outputs/bundle -type f -maxdepth 5 -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamTotal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: StreamTotal-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
