name: Build StreamTotal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Verify release outputs
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamTotal-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: StreamTotal-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
